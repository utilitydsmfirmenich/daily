name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Hanya satu deploy berjalan pada satu waktu; deploy yang sedang jalan tidak dibatalkan.
concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Test, Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build
        run: npm run build

      # Secret GEMINI_API_KEY disimpan permanen di Cloudflare (wrangler secret put),
      # sehingga tidak terhapus oleh deploy dan tidak perlu ada di GitHub.
      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
